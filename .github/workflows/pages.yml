name: Build and deploy wiki

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: wiki-pages
  cancel-in-progress: false

env:
  SIMIKI3_REQUIREMENT: "simiki3 @ git+https://github.com/hmgle/simiki3.git@b8a1100473e9bd3aafb3e402ef923d45ca93cf24"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          version: latest

      - name: Verify simiki3
        run: uv run --isolated --with "$SIMIKI3_REQUIREMENT" simiki3 --version

      - name: Sync legacy simple2 theme
        run: uv run --isolated --with "$SIMIKI3_REQUIREMENT" simiki3 theme sync simple2 --path .

      - name: Build wiki
        run: uv run --isolated --with "$SIMIKI3_REQUIREMENT" simiki3 build .

      - name: Check generated site
        run: |
          test -s output/index.html
          test -s output/atom.xml
          test -s output/static/css/style.css
          test -s output/static/css/tango.css
          test -s output/search/sphinx.html
          test -s output/tip/forwarded_tips.html

      - name: Upload build artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: wiki-output
          path: output
          if-no-files-found: error
          retention-days: 1

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: wiki-output
          path: output

      - name: Publish gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./output
